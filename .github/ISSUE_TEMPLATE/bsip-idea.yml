name: BSIP idea / discussion
description: Propose or discuss an idea before writing a full BSIP draft.
title: "[Idea] <short title>"
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Use this to vet an idea before drafting a BSIP. Read [BSIP-1](https://github.com/bitsocialnet/BSIPs/blob/master/BSIPS/bsip-1.md) first.
        BSIPs cover the **decentralized** Bitsocial protocol — not centralized products built on top of it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is the current protocol inadequate?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Sketch the change. Field names, message shapes, or behavior where you can.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Likely type
      options:
        - Standards Track
        - Meta
        - Informational
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Likely category (Standards Track only)
      options:
        - Core
        - Networking
        - Interface
        - Appchain
        - Application
        - Not applicable / not sure
    validations:
      required: false
  - type: input
    id: implementations
    attributes:
      label: Affected implementations
      description: Which clients, nodes, or services would have to conform?
    validations:
      required: false
